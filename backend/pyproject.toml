[project]
name = "gatezero"
version = "0.1.0"
description = "Zero-trust security gateway for AI agent tool calls"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, S: bandit security rules,
# UP: pyupgrade, SIM: simplifications
select = ["E", "F", "I", "B", "S", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in default args is the intended pattern

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert and fake test credentials are fine in tests
"alembic/**" = ["E501"]
